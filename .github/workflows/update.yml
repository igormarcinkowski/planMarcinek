name: Aktualizuj plan i zastępstwa

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: plan2-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Sprawdź zmianę obowiązywania planu
        run: python update_plan.py

      - name: Pobierz zastępstwa dla bieżącego tygodnia
        run: python zastepstwa.py

      - name: Zapisz dane
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Brak zmian danych."
          else
            git commit -m "Automatyczna aktualizacja planu i zastępstw"
            git push
          fi

      - name: Przygotuj stronę
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v5
